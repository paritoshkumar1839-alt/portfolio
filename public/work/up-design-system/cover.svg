<svg width="1200" height="900" viewBox="0 0 1200 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="UP Design System — foundations and components">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0e0e0e"/>
      <stop offset="1" stop-color="#070707"/>
    </linearGradient>
    <linearGradient id="sheen" x1="120" y1="120" x2="620" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cfccc7"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>

  <!-- eyebrow -->
  <text x="120" y="150" font-family="Montserrat, ui-sans-serif, system-ui, sans-serif" font-size="22" letter-spacing="4" fill="#6b6866" font-weight="600">DESIGN SYSTEM · URBANPIPER</text>

  <!-- Big type specimen -->
  <text x="112" y="380" font-family="'Source Sans 3','Source Sans Pro', ui-sans-serif, system-ui, sans-serif" font-size="300" fill="url(#sheen)" font-weight="600" letter-spacing="-6">Aa</text>
  <text x="120" y="470" font-family="'Source Sans 3','Source Sans Pro', ui-sans-serif, system-ui, sans-serif" font-size="26" fill="#9c9895" font-weight="400">Source Sans · 400 / 600 / 700</text>

  <!-- Color tokens row -->
  <g>
    <rect x="120" y="560" width="150" height="150" rx="18" fill="#2F58F2"/>
    <rect x="290" y="560" width="150" height="150" rx="18" fill="#2ECC71"/>
    <rect x="460" y="560" width="150" height="150" rx="18" fill="#FF425C"/>
    <rect x="630" y="560" width="150" height="150" rx="18" fill="#ECC900"/>
    <rect x="800" y="560" width="150" height="150" rx="18" fill="#753675"/>
    <rect x="970" y="560" width="150" height="150" rx="18" fill="#175751"/>
  </g>

  <!-- token labels -->
  <g font-family="Montserrat, ui-sans-serif, system-ui, sans-serif" font-size="18" fill="#6b6866" font-weight="500">
    <text x="120" y="748">#2F58F2</text>
    <text x="290" y="748">#2ECC71</text>
    <text x="460" y="748">#FF425C</text>
    <text x="630" y="748">#ECC900</text>
    <text x="800" y="748">#753675</text>
    <text x="970" y="748">#175751</text>
  </g>

  <!-- component chips -->
  <g font-family="'Source Sans 3', ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="600">
    <rect x="800" y="150" width="150" height="52" rx="10" fill="#2F58F2"/>
    <text x="875" y="184" fill="#ffffff" text-anchor="middle">Button</text>
    <rect x="968" y="150" width="112" height="52" rx="26" fill="none" stroke="#343330"/>
    <text x="1024" y="184" fill="#9c9895" text-anchor="middle" font-weight="500">Chip</text>
    <rect x="800" y="222" width="280" height="52" rx="10" fill="none" stroke="#242424"/>
    <text x="820" y="256" fill="#6b6866" font-weight="400">Input field</text>
    <rect x="800" y="300" width="70" height="38" rx="19" fill="#2ECC71"/>
    <circle cx="851" cy="319" r="15" fill="#ffffff"/>
    <text x="884" y="326" fill="#9c9895" font-weight="500" font-size="20">Switch</text>
  </g>

  <!-- footer wordmark -->
  <text x="120" y="828" font-family="'Source Sans 3','Source Sans Pro', ui-sans-serif, system-ui, sans-serif" font-size="34" fill="#f4f3f1" font-weight="700">UP Design System</text>
  <line x1="120" y1="200" x2="1080" y2="200" stroke="#1c1c1c"/>
</svg>
